[workspace]
resolver = "3"
members = ["crates/omavim-vim", "crates/omavim"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[profile.release]
lto = "thin"

# The Neovim fixtures run tens of thousands of cases (and parse megabytes
# of JSON): worth optimising.
[profile.dev.package.omavim-vim]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
